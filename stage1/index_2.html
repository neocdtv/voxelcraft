<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Voxelcraft · single-file Three.js</title>
<style>
  :root { --accent: #9fe870; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0f14;
    font-family: system-ui, "Segoe UI", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  /* ---- crosshair ---- */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); pointer-events: none;
    mix-blend-mode: difference; display: none; z-index: 5;
  }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 5; pointer-events: none;
    color: #fff; font: 12px/1.6 ui-monospace, monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }

  /* ---- hotbar ---- */
  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 5; pointer-events: none;
  }
  .slot {
    width: 46px; height: 46px; border-radius: 8px; position: relative;
    background: rgba(0,0,0,.42); border: 2px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    transition: transform .12s ease, border-color .12s ease;
  }
  .slot.active { border-color: #fff; transform: translateY(-4px);
                 box-shadow: 0 4px 14px rgba(0,0,0,.45); }
  .slot .swatch {
    width: 26px; height: 26px; border-radius: 5px;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22);
  }
  .slot span { position: absolute; top: 3px; left: 6px; font: 10px ui-monospace, monospace;
               color: #fff; text-shadow: 0 1px 1px #000; }

  /* ---- touch UI (only visible on touch devices) ---- */
  #joy, .tbtn { display: none; }
  body.touch #joy, body.touch .tbtn { display: flex; }

  #joy {
    position: fixed; z-index: 8; left: -100px; top: -100px;
    width: 118px; height: 118px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.28);
    transform: translate(-50%, -50%); pointer-events: none;
    align-items: center; justify-content: center;
  }
  #joyKnob {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.55);
  }
  .tbtn {
    position: fixed; z-index: 8; right: 14px;
    border-radius: 50%; align-items: center; justify-content: center;
    background: rgba(0,0,0,.38); border: 2px solid rgba(255,255,255,.45);
    color: #fff; font-size: 24px; line-height: 1;
  }
  .tbtn:active { background: rgba(255,255,255,.28); }
  #btnJump  { width: 74px; height: 74px; font-size: 30px; bottom: calc(14px  + env(safe-area-inset-bottom)); }
  #btnBreak { width: 58px; height: 58px; font-size: 22px; bottom: calc(100px + env(safe-area-inset-bottom)); }
  #btnPlace { width: 58px; height: 58px; font-size: 22px; bottom: calc(170px + env(safe-area-inset-bottom)); }

  @media (max-width: 480px) {
    .slot { width: 38px; height: 38px; }
    .slot .swatch { width: 22px; height: 22px; }
    #hud { font-size: 10px; }
  }

  /* ---- pause / start overlay ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    background: rgba(8,12,20,.68); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); font-weight: 900; letter-spacing: .12em; }
  #overlay h1 em { font-style: normal; color: var(--accent); }
  #overlay .sub { margin: 6px 0 26px; letter-spacing: .3em; font-size: 12px; opacity: .75; }
  #overlay .keys {
    display: grid; grid-template-columns: auto auto; gap: 8px 22px;
    font: 13px/1.5 ui-monospace, monospace; text-align: left;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
    padding: 18px 28px; border-radius: 12px;
  }
  #overlay .keys b { color: var(--accent); font-weight: 600; text-align: right; }
  #overlay .play { margin-top: 28px; font-size: 14px; letter-spacing: .35em;
                   animation: pulse 1.6s ease-in-out infinite; }
  #overlay .note { margin-top: 14px; font-size: 11px; opacity: .5; letter-spacing: .1em; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="hotbar"></div>

<!-- touch controls -->
<div id="joy"><div id="joyKnob"></div></div>
<div id="btnPlace" class="tbtn" aria-label="place block">🧱</div>
<div id="btnBreak" class="tbtn" aria-label="break block">⛏️</div>
<div id="btnJump"  class="tbtn" aria-label="jump">⬆️</div>

<div id="overlay">
  <h1>VOXEL<em>CRAFT</em></h1>
  <div class="sub">A MINECLONE IN ONE HTML FILE</div>
  <div class="keys">
    <b>W A S D</b><span>move</span>
    <b>MOUSE</b><span>look around</span>
    <b>SPACE</b><span>jump</span>
    <b>SHIFT</b><span>sprint</span>
    <b>LEFT CLICK</b><span>break block</span>
    <b>RIGHT CLICK</b><span>place block</span>
    <b>1–4 / WHEEL</b><span>pick block</span>
    <b>ESC</b><span>pause</span>
  </div>
  <div class="play">CLICK TO PLAY</div>
  <div class="note">DESKTOP BROWSER + MOUSE REQUIRED</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ============================== config ============================== */
const isTouch = !!window.matchMedia && matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

const WORLD   = 32;                 // 32 x 32 block grid
const MAX_Y   = 48;                 // building height limit
const MAX_INSTANCES = WORLD * WORLD * 16;
const GRAVITY = 24;
const JUMP    = 8.6;
const WALK    = 5.2;
const SPRINT  = 7.6;
const REACH   = 7;
const LOOK_SENS = 0.0045;           // rad per px of touch drag

/* ============================== scene =============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc8ff);
scene.fog = new THREE.Fog(0x8fc8ff, 45, 130);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 300);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x5c6b46, 0.95));
const sun = new THREE.DirectionalLight(0xfff1cf, 1.7);
sun.position.set(38, 62, 18);
sun.castShadow = true;
const shadowRes = isTouch ? 1024 : 2048;
sun.shadow.mapSize.set(shadowRes, shadowRes);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 10, far: 150 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

/* ================== deterministic value-noise terrain ================= */
function hash2(x, z) {
  let n = (Math.imul(x, 374761393) + Math.imul(z, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const u = x - xi, v = z - zi;
  const sm = t => t * t * (3 - 2 * t);
  const a = hash2(xi, zi),     b = hash2(xi + 1, zi);
  const c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  const su = sm(u), sv = sm(v);
  return a + (b - a) * su + (c - a) * sv + (a - b - c + d) * su * sv;
}
function terrainHeight(x, z) {
  const n = valueNoise(x * 0.13 + 37, z * 0.13 + 91) * 0.65
          + valueNoise(x * 0.37 + 7,  z * 0.37 + 13) * 0.35;
  return Math.max(1, Math.round(1 + n * 9));        // 1..10
}

/* ============================== world ================================ */
const TYPES  = { grass: 0x55a63b, dirt: 0x8a5a34, stone: 0x9a9a9a, sand: 0xd8cf8f, wood: 0xa06a3a };
const HOTBAR = ['grass', 'dirt', 'stone', 'wood'];
let selected = 0;

const blocks = new Map();                            // "x,y,z" -> type
const key = (x, y, z) => x + ',' + y + ',' + z;

for (let x = 0; x < WORLD; x++)
  for (let z = 0; z < WORLD; z++) {
    const h = terrainHeight(x, z);
    for (let y = 0; y <= h; y++) {
      const t = y === h ? (h <= 2 ? 'sand' : 'grass')
              : y >= h - 2 ? 'dirt'
              : 'stone';
      blocks.set(key(x, y, z), t);
    }
  }

/* one InstancedMesh holds the whole world — single draw call */
const terrain = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshLambertMaterial({ color: 0xffffff }),
  MAX_INSTANCES
);
terrain.castShadow = true;
terrain.receiveShadow = true;
terrain.frustumCulled = false;
scene.add(terrain);

const instanceKeys = new Array(MAX_INSTANCES);       // instanceId -> block key
const _m = new THREE.Matrix4();
const _c = new THREE.Color();

function rebuild() {
  let i = 0;
  for (const [k, t] of blocks) {
    const [x, y, z] = k.split(',').map(Number);
    _m.makeTranslation(x + 0.5, y + 0.5, z + 0.5);
    terrain.setMatrixAt(i, _m);
    _c.setHex(TYPES[t]).offsetHSL(0, 0, (hash2(x * 7 + y * 131, z * 13 + y * 17) - 0.5) * 0.05);
    terrain.setColorAt(i, _c);
    instanceKeys[i] = k;
    i++;
  }
  terrain.count = i;
  terrain.instanceMatrix.needsUpdate = true;
  if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
}
rebuild();

/* block-target highlight */
const highlight = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02)),
  new THREE.LineBasicMaterial({ color: 0x0a0a0a, transparent: true, opacity: 0.85 })
);
highlight.visible = false;
scene.add(highlight);

/* drifting clouds */
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group();
  const puffs = 3 + (i % 3);
  for (let j = 0; j < puffs; j++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(3 + Math.random() * 5, 0.9, 2.5 + Math.random() * 3.5), cloudMat);
    m.position.set((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 1.4, (Math.random() - 0.5) * 5);
    g.add(m);
  }
  g.position.set(Math.random() * 140 - 70, 26 + Math.random() * 8, Math.random() * 140 - 70);
  scene.add(g);
  clouds.push(g);
}

/* ============================== player =============================== */
const UP = new THREE.Vector3(0, 1, 0);
const player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  onGround: false, halfW: 0.3, height: 1.8, eye: 1.62,
};
function respawn() {
  const x = 16, z = 16;
  player.pos.set(x + 0.5, terrainHeight(x, z) + 1.01, z + 0.5);
  player.vel.set(0, 0, 0);
}
respawn();

/* AABB-vs-block-grid collision */
function collides(px, py, pz) {
  const x0 = Math.floor(px - player.halfW), x1 = Math.floor(px + player.halfW);
  const y0 = Math.floor(py),                 y1 = Math.floor(py + player.height);
  const z0 = Math.floor(pz - player.halfW), z1 = Math.floor(pz + player.halfW);
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++)
        if (blocks.has(x + ',' + y + ',' + z)) return true;
  return false;
}

/* input state (shared by keyboard + touch) */
const keys = Object.create(null);
const joy  = { id: null, ox: 0, oy: 0, fx: 0, fy: 0 };   // virtual joystick
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _wish = new THREE.Vector3();

function step(dt) {
  // desired horizontal velocity from camera yaw (keys + joystick)
  camera.getWorldDirection(_fwd); _fwd.y = 0; _fwd.normalize();
  _right.crossVectors(_fwd, UP);
  let f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - joy.fy;
  let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.fx;
  const fl = Math.hypot(f, s);
  if (fl > 1) { f /= fl; s /= fl; }
  _wish.set(0, 0, 0).addScaledVector(_fwd, f).addScaledVector(_right, s);
  if (_wish.lengthSq() > 0)
    _wish.normalize().multiplyScalar(keys.ShiftLeft || keys.ShiftRight ? SPRINT : WALK);

  const blend = 1 - Math.exp(-14 * dt);
  player.vel.x += (_wish.x - player.vel.x) * blend;
  player.vel.z += (_wish.z - player.vel.z) * blend;
  player.vel.y = Math.max(player.vel.y - GRAVITY * dt, -18);   // gravity + terminal velocity

  if (keys.Space && player.onGround) {
    player.vel.y = JUMP; player.onGround = false; sfx('jump');
  }

  const p = player.pos, w = player.halfW;

  // X axis: move, then clamp out of any block we hit
  let nx = p.x + player.vel.x * dt;
  if (collides(nx, p.y, p.z)) {
    nx = player.vel.x > 0
      ? Math.floor(nx + w) - w - 1e-4
      : Math.floor(nx - w) + 1 + w + 1e-4;
    if (collides(nx, p.y, p.z)) nx = p.x;
    player.vel.x = 0;
  }
  p.x = nx;

  // Z axis
  let nz = p.z + player.vel.z * dt;
  if (collides(p.x, p.y, nz)) {
    nz = player.vel.z > 0
      ? Math.floor(nz + w) - w - 1e-4
      : Math.floor(nz - w) + 1 + w + 1e-4;
    if (collides(p.x, p.y, nz)) nz = p.z;
    player.vel.z = 0;
  }
  p.z = nz;

  // Y axis: land on / bonk against blocks
  let ny = p.y + player.vel.y * dt;
  if (collides(p.x, ny, p.z)) {
    if (player.vel.y <= 0) { ny = Math.floor(ny) + 1 + 1e-4; player.onGround = true; }
    else { ny = Math.floor(ny + player.height) - player.height - 1e-4; }
    player.vel.y = 0;
  } else {
    player.onGround = false;
  }
  p.y = ny;

  // keep on the island, respawn if the floor got dug out
  p.x = THREE.MathUtils.clamp(p.x, 0.4, WORLD - 0.4);
  p.z = THREE.MathUtils.clamp(p.z, 0.4, WORLD - 0.4);
  if (p.y < -24) respawn();
}

/* ====================== raycasting: break / place ==================== */
const raycaster = new THREE.Raycaster();
raycaster.far = REACH;
const _ndc = new THREE.Vector2(0, 0);

function pick() {
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObject(terrain);
  if (!hits.length) return null;
  const h = hits[0];
  const [x, y, z] = instanceKeys[h.instanceId].split(',').map(Number);
  return { x, y, z,
    nx: Math.round(h.face.normal.x),
    ny: Math.round(h.face.normal.y),
    nz: Math.round(h.face.normal.z) };
}

function removeBlock(hit) {
  if (hit.y === 0) return;                              // bottom layer is bedrock
  if (blocks.delete(key(hit.x, hit.y, hit.z))) { rebuild(); sfx('dig'); }
}

function placeBlock(hit) {
  const x = hit.x + hit.nx, y = hit.y + hit.ny, z = hit.z + hit.nz;
  if (x < 0 || x >= WORLD || z < 0 || z >= WORLD || y < 0 || y >= MAX_Y) return;
  const k = key(x, y, z);
  if (blocks.has(k)) return;
  const p = player.pos, w = player.halfW;               // don't place inside the player
  if (x + 1 > p.x - w && x < p.x + w &&
      z + 1 > p.z - w && z < p.z + w &&
      y + 1 > p.y &&   y < p.y + player.height) return;
  blocks.set(k, HOTBAR[selected]);
  rebuild();
  sfx('place');
}

function doAction(kind) {
  if (!isPlaying()) return;
  const hit = pick();
  if (!hit) return;
  if (kind === 'break') removeBlock(hit);
  else placeBlock(hit);
}

/* ============================ input & UI ============================= */
const controls  = new PointerLockControls(camera, renderer.domElement);
const overlay   = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
const hud       = document.getElementById('hud');

/* touch camera state (mobile has no pointer lock) */
let yaw = 0.7, pitch = -0.12;
let touchPlaying = false;
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const isPlaying = () => (isTouch ? touchPlaying : controls.isLocked);

/* tiny WebAudio blips — no assets needed */
let actx = null;
function initAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { /* no audio */ }
}
function sfx(kind) {
  try {
    initAudio();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g).connect(actx.destination);
    if (kind === 'dig')   { o.type = 'square'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(70,  t + 0.10); g.gain.setValueAtTime(0.10, t); }
    if (kind === 'place') { o.type = 'square'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(330, t + 0.08); g.gain.setValueAtTime(0.10, t); }
    if (kind === 'jump')  { o.type = 'sine';   o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(420, t + 0.12); g.gain.setValueAtTime(0.05, t); }
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.start(t); o.stop(t + 0.16);
  } catch (e) { /* audio unavailable — ignore */ }
}

/* start / pause */
overlay.addEventListener('click', () => {
  initAudio();
  if (isTouch) {
    touchPlaying = true;
    overlay.classList.add('hidden');
    crosshair.style.display = 'block';
  } else {
    controls.lock();
  }
});
controls.addEventListener('lock',   () => { overlay.classList.add('hidden');  crosshair.style.display = 'block'; });
controls.addEventListener('unlock', () => { overlay.classList.remove('hidden'); crosshair.style.display = 'none'; highlight.visible = false; });

/* keyboard (desktop) */
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  const d = e.code.match(/^Digit([1-4])$/);
  if (d) selectSlot(+d[1] - 1);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('wheel', e => selectSlot((selected + (e.deltaY > 0 ? 1 : 3)) % 4));

/* mouse (desktop) */
renderer.domElement.addEventListener('mousedown', e => {
  if (!controls.isLocked) return;
  if (e.button === 0) doAction('break');
  else if (e.button === 2) doAction('place');
});
addEventListener('contextmenu', e => e.preventDefault());

/* hotbar (clickable everywhere, tappable on phones) */
const hotbar = document.getElementById('hotbar');
for (const [i, t] of HOTBAR.entries()) {
  const slot = document.createElement('div');
  slot.className = 'slot' + (i === 0 ? ' active' : '');
  slot.innerHTML = `<span>${i + 1}</span><div class="swatch" style="background:#${TYPES[t].toString(16).padStart(6, '0')}"></div>`;
  slot.addEventListener('click', () => selectSlot(i));
  hotbar.appendChild(slot);
}
function selectSlot(i) {
  selected = i;
  [...hotbar.children].forEach((el, j) => el.classList.toggle('active', j === i));
}

/* --------------------- touch controls (mobile) ---------------------- */
if (isTouch) {
  const joyEl = document.getElementById('joy');
  const knob  = document.getElementById('joyKnob');
  const R = 44;                                    // joystick travel radius (px)
  let lookId = null, lookX = 0, lookY = 0, lookStartT = 0, lookMoved = 0;

  renderer.domElement.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX < window.innerWidth * 0.45 && joy.id === null) {
        // left half -> spawn floating joystick here
        joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY;
        joy.fx = 0; joy.fy = 0;
        joyEl.style.left = t.clientX + 'px';
        joyEl.style.top  = t.clientY + 'px';
        joyEl.style.display = 'flex';
        knob.style.transform = 'translate(0px, 0px)';
      } else if (t.clientX >= window.innerWidth * 0.45 && lookId === null) {
        // right half -> look
        lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
        lookStartT = performance.now(); lookMoved = 0;
      }
    }
  }, { passive: false });

  renderer.domElement.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) {
        let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
        const len = Math.hypot(dx, dy);
        if (len > R) { dx *= R / len; dy *= R / len; }
        joy.fx = dx / R; joy.fy = dy / R;
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
      } else if (t.identifier === lookId) {
        yaw   -= (t.clientX - lookX) * LOOK_SENS;
        pitch  = THREE.MathUtils.clamp(pitch - (t.clientY - lookY) * LOOK_SENS, -1.55, 1.55);
        lookMoved += Math.abs(t.clientX - lookX) + Math.abs(t.clientY - lookY);
        lookX = t.clientX; lookY = t.clientY;
      }
    }
  }, { passive: false });

  const onTouchEnd = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) {
        joy.id = null; joy.fx = 0; joy.fy = 0;
        joyEl.style.display = 'none';
      } else if (t.identifier === lookId) {
        const quick = performance.now() - lookStartT < 250 && lookMoved < 14;
        lookId = null;
        if (quick) doAction('break');              // quick tap = break
      }
    }
  };
  renderer.domElement.addEventListener('touchend', onTouchEnd, { passive: false });
  renderer.domElement.addEventListener('touchcancel', onTouchEnd, { passive: false });

  /* action buttons */
  const bind = (id, onDown, onUp) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); }, { passive: false });
    if (onUp) el.addEventListener('touchend', e => { e.preventDefault(); onUp(); }, { passive: false });
  };
  bind('btnJump',  () => { keys.Space = true; }, () => { keys.Space = false; });
  bind('btnBreak', () => doAction('break'));
  bind('btnPlace', () => doAction('place'));

  /* swap overlay text for touch instructions */
  document.querySelector('#overlay .keys').innerHTML = `
    <b>LEFT THUMB</b><span>move · floating joystick</span>
    <b>RIGHT THUMB</b><span>look around</span>
    <b>QUICK TAP</b><span>break block</span>
    <b>⛏ / 🧱</b><span>break / place</span>
    <b>⬆</b><span>jump</span>
    <b>HOTBAR</b><span>tap a slot to pick a block</span>`;
  document.querySelector('#overlay .play').textContent = 'TAP TO PLAY';
  document.querySelector('#overlay .note').textContent = 'LANDSCAPE RECOMMENDED';
}

/* ============================ main loop ============================== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.033);

  if (isPlaying()) {
    step(dt);
    const hit = pick();
    if (hit) { highlight.position.set(hit.x + .5, hit.y + .5, hit.z + .5); highlight.visible = true; }
    else highlight.visible = false;
    if (isTouch) camera.quaternion.setFromEuler(_euler.set(pitch, yaw, 0));
  } else if (isTouch) {
    yaw += dt * 0.05;                               // slow idle orbit behind the menu
    camera.quaternion.setFromEuler(_euler.set(pitch, yaw, 0));
  }

  for (const c of clouds) { c.position.x += dt * 1.1; if (c.position.x > 80) c.position.x = -80; }

  camera.position.set(player.pos.x, player.pos.y + player.eye, player.pos.z);
  hud.textContent =
    `blocks ${terrain.count}  ·  x ${player.pos.x.toFixed(1)}  y ${player.pos.y.toFixed(1)}  z ${player.pos.z.toFixed(1)}`;
  renderer.render(scene, camera);
});

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
</script>
</body>
</html>
