<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxelcraft</title>
<style>
  :root { --accent: #9fe870; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14;
               font-family: system-ui, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- crosshair ---- */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); pointer-events: none;
    mix-blend-mode: difference; display: none; z-index: 5;
  }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 5; pointer-events: none;
    color: #fff; font: 12px/1.6 ui-monospace, monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }

  /* ---- hotbar ---- */
  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 5; pointer-events: none;
  }
  .slot {
    width: 46px; height: 46px; border-radius: 8px; position: relative;
    background: rgba(0,0,0,.42); border: 2px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, border-color .12s ease;
  }
  .slot.active { border-color: #fff; transform: translateY(-4px);
                 box-shadow: 0 4px 14px rgba(0,0,0,.45); }
  .slot .swatch {
    width: 26px; height: 26px; border-radius: 5px;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22);
  }
  .slot span { position: absolute; top: 3px; left: 6px; font: 10px ui-monospace, monospace;
               color: #fff; text-shadow: 0 1px 1px #000; }

  /* ---- pause / start overlay ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    background: rgba(8,12,20,.68); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); font-weight: 900; letter-spacing: .12em; }
  #overlay h1 em { font-style: normal; color: var(--accent); }
  #overlay .sub { margin: 6px 0 26px; letter-spacing: .3em; font-size: 12px; opacity: .75; }
  #overlay .keys {
    display: grid; grid-template-columns: auto auto; gap: 8px 22px;
    font: 13px/1.5 ui-monospace, monospace; text-align: left;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
    padding: 18px 28px; border-radius: 12px;
  }
  #overlay .keys b { color: var(--accent); font-weight: 600; text-align: right; }
  #overlay .play { margin-top: 28px; font-size: 14px; letter-spacing: .35em;
                   animation: pulse 1.6s ease-in-out infinite; }
  #overlay .note { margin-top: 14px; font-size: 11px; opacity: .5; letter-spacing: .1em; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="hotbar"></div>

<div id="overlay">
  <h1>VOXEL<em>CRAFT</em></h1>
  <div class="sub">A MINECLONE IN ONE HTML FILE</div>
  <div class="keys">
    <b>↑ ↓ ← →</b><span>move</span>
    <b>MOUSE</b><span>look around</span>
    <b>SPACE</b><span>jump</span>
    <b>SHIFT</b><span>sprint</span>
    <b>LEFT CLICK</b><span>break block</span>
    <b>RIGHT CLICK</b><span>place block</span>
    <b>1–9 / WHEEL</b><span>pick block</span>
    <b>V</b><span>toggle 1st / 3rd person view</span>

    <b>ESC</b><span>pause</span>
  </div>
  <div class="play">CLICK TO PLAY</div>
  <div class="note">DESKTOP BROWSER + MOUSE REQUIRED</div>
</div>
</body>
</html>
